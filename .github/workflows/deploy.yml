name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # The CV is a second rendering of the SAME data as the site. Generate its
      # Awesome-CV LaTeX into build/ (OUTSIDE _site — the .tex must never be
      # published; generate.js also copies the vendored awesome-cv.cls next to
      # it), compile to PDF, and copy ONLY the PDF over the passthrough résumé so
      # the download always serves the freshly generated, never-stale CV.
      - name: Generate CV LaTeX
        run: node cv/generate.js

      - name: Compile CV PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: build/cv/resume.tex
          # Compile in build/cv/ so \documentclass finds the vendored .cls.
          work_in_root_file_dir: true
          # Awesome-CV needs a Unicode engine + fontspec — compile with lualatex
          # (matches cv/preamble.tex), NOT pdflatex. Source Sans 3, Roboto and
          # FontAwesome 6 come from the action's full-scheme TeX Live.
          latexmk_use_lualatex: true

      # The résumé PDF is NOT committed — it is generated here and placed into
      # the deploy output, which is what makes it available on the site.
      - name: Publish generated PDF as the résumé
        run: |
          mkdir -p _site/assets
          cp build/cv/resume.pdf _site/assets/anish-badri-resume.pdf

      # Turn "publish only the intended files" into a build that REFUSES to
      # publish anything else: fail on any stray .tex, or any .json OTHER than
      # the one intentional /resume.json (the published JSON Resume).
      - name: Guard — only site assets, the PDF and resume.json may be published
        run: |
          stray=$(find _site \( -name '*.tex' -o -name '*.json' \) ! -path '_site/resume.json')
          if [ -n "$stray" ]; then
            echo "::error::Unintended file(s) staged for publish:"
            echo "$stray"
            exit 1
          fi
          echo "Publish guard passed: only site assets, the PDF and resume.json."

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
